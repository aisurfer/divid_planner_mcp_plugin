# Secret scan policy for this plugin (.github/check/gitleaks.sh): gitleaks default rules plus the extra rules below.
# No allow-lists and no baseline: this repository must stay at 0 findings. Generated from the DIVID copy and security rules; do not edit by hand.
title = "divid-planner plugin"

[extend]
useDefault = true

[[rules]]
id = "divid-env-secret"
description = "Secret-named variable with a literal value in an env file (.env*, *.env)"
path = '''(^|/)(\.env[^/]*|[^/]*\.env)$'''
regex = '''(?im)^[ \t]*(?:export[ \t]+)?[A-Z0-9_]*(?:SECRET|TOKEN|PASSWORD|PASSWD|API_KEY|APIKEY|PRIVATE_KEY|HMAC_KEY|FERNET_KEY|INVITE_CODE|EMAIL_SERVER|DATABASE_URL|_DSN)[A-Z0-9_]*[ \t]*=[ \t]*['"]?([^\s'"#$]{8,512})'''
secretGroup = 1
entropy = 2.5
keywords = ["secret", "token", "password", "passwd", "api_key", "apikey", "private_key", "hmac_key", "fernet_key", "invite_code", "email_server", "database_url", "_dsn"]
  [[rules.allowlists]]
  description = "placeholders in examples and templates"
  regexTarget = "secret"
  regexes = [
    '''(?i)^(change[-_]?me|example|placeholder|your[-_a-z]*|x{4,}|\*{3,}|dummy|test|local[-_a-z]*|dev[-_a-z]*|<[^>]*>|\{\{.*\}\})''',
    '''(?i)(example\.(com|org|test)|localhost|127\.0\.0\.1)''',
  ]

[[rules]]
id = "divid-url-credentials"
description = "Password embedded in a connection URL (postgres://, smtp://, redis://, mongodb://, amqp://, https://)"
regex = '''\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|rediss|amqps?|smtps?|ftp|https?)://[^\s:/@'"<>]{1,64}:([^\s@'"<>/]{6,128})@[^\s'"<>]+'''
secretGroup = 1
entropy = 2.8
keywords = ["://"]
  [[rules.allowlists]]
  description = "local-only dev compose databases (ports bound to 127.0.0.1)"
  paths = ['''(^|/)compose\.dev\.ya?ml$''']
  [[rules.allowlists]]
  description = "variable references and well-known local/test passwords"
  regexTarget = "secret"
  regexes = [
    '''^[$%{<]''',
    '''(?i)^(password|passwd|secret|changeme|postgres|divid|example|test|testing|local[a-z_]*|dev[a-z_]*|pass(word)?\d*|x+|\*+)$''',
  ]

[[rules]]
id = "gcp-oauth-client-secret"
description = "Google OAuth client secret (GOCSPX-)"
regex = '''\b(GOCSPX-[A-Za-z0-9_-]{28})\b'''
secretGroup = 1
keywords = ["gocspx-"]

[[rules]]
id = "divid-telegram-bot-token"
description = "Telegram bot token anywhere (the default rule needs the word 'telegram' nearby)"
regex = '''\b(\d{8,10}:AA[0-9A-Za-z_-]{33})\b'''
secretGroup = 1
keywords = [":aa"]

[[rules]]
id = "divid-nginx-secret-header"
description = "Shared secret compared in an nginx `if ($http_x = \"...\")` block"
regex = '''if\s*\(\s*\$http_[a-z0-9_]+\s*=\s*["']([^"']{8,})["']'''
secretGroup = 1
keywords = ["$http_"]

[[allowlists]]
description = "git metadata"
paths = ['''(^|/)\.git/''']
